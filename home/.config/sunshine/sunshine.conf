# Sunshine host config (RDR2 / Moonlight TV plan)
sunshine_name = bricked

# Encoding / capture on the RX 9070 XT (renderD128)
encoder = vaapi
adapter_name = /dev/dri/renderD128
capture = kms
# 0 = advertise HEVC automatically when the encoder supports it
hevc_mode = 0

# Security
# 2 = encryption required for LAN streams
lan_encryption_mode = 2
# Web UI only from this PC (https://localhost:47990)
origin_web_ui_allowed = pc
# Only gamepad input is accepted from clients
keyboard = disabled
mouse = disabled
# Controller is paired to the PC over Bluetooth; the TV is display-only
controller = disabled
