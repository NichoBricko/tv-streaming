  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>
  <!-- TV -->
  <rect x="76" y="120" width="360" height="232" rx="22" fill="#0a1020" stroke="#9fb3d9" stroke-width="12"/>
  <rect x="96" y="140" width="320" height="192" rx="10" fill="url(#screen)"/>
